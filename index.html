<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        var theme;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        // White is the default; dark only when the visitor picked it.
        if (theme !== "dark") theme = "light";
        document.documentElement.dataset.theme = theme;
        if (theme === "dark") document.querySelector("meta[name=theme-color]").setAttribute("content", "#08113a");
      })();
    </script>
    <meta name="description" content="Aayush Vishwakarma (Bugholic): full-stack and AI engineer building production web apps, RAG pipelines and MCP servers with Next.js, TypeScript, Python and Node.js." />
